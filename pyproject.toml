[project]
name = "tableau-noir"
version = "0.1.0"
description = "Tableau Noir : l'analyse tactique du football à la craie, à partir de données ouvertes (Hudl StatsBomb, Wyscout)."
readme = "README.md"
authors = [{ name = "Morgan Guillaudeux" }]
license = { text = "MIT" }
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.0",
    "pandas>=2.2",
    "scipy>=1.13",
]

[project.scripts]
tableau-noir = "tableau_noir.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.10",
    "pandas-stubs>=2.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tableau_noir"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: tests sur les données réelles (plus lents)"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"
# la prose du dossier : des paragraphes, pas du code
extend-exclude = ["data/editorial"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "N"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["tableau_noir"]

[[tool.mypy.overrides]]
module = ["scipy.*"]
ignore_missing_imports = true
