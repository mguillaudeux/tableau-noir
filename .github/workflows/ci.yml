name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      # Les tests d'intégration lisent web/data (versionné) ; les unitaires n'ont besoin de rien.
      - run: uv run pytest
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --test web/tests/*.test.mjs
